<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page Not Found — The Sternberg Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F6F1;--ink:#1A1A1A;--muted:#5B6B5B;--gold:#B8945A;--serif:'Cormorant Garamond',serif;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;font-size:17px;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 32px}
.code{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:32px}
h1{font-family:var(--serif);font-size:84px;font-weight:400;line-height:1.05;letter-spacing:-1.5px;margin-bottom:24px}
.message{font-family:var(--serif);font-size:24px;font-weight:300;font-style:italic;color:var(--muted);max-width:560px;margin:0 auto 48px}
.return-link{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;text-decoration:none;border:1px solid var(--gold);padding:14px 28px;display:inline-block;transition:background 0.2s,color 0.2s}
.return-link:hover{background:var(--gold);color:var(--ink)}
footer{padding:40px 0;text-align:center}
.footer-text{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
@media (max-width:768px){h1{font-size:54px}.message{font-size:20px}}
</style>
</head>
<body>

<main>
  <div class="code">Error 404</div>
  <h1>Page not found</h1>
  <div class="message">The page you were looking for is not part of the archive. It may have moved, or it may never have existed.</div>
  <a href="./index.html" class="return-link">Return to the collection &rarr;</a>
</main>

<footer>
  <div class="footer-text">The Sternberg Collection &mdash; STERNBERG-LOT-2026</div>
</footer>

</body>
</html>
